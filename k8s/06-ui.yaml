apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: microservice-iae
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: microservice-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: microservice-iae
spec:
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30300
  type: NodePort
