apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservice-iae
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: DB_HOST
              value: "order-db"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "root"
            - name: DB_NAME
              value: "orderservice_db"
            - name: USER_SERVICE_URL
              value: "http://user-service:8000"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8000"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservice-iae
spec:
  selector:
    app: order-service
  ports:
    - port: 8003
      targetPort: 8003
      nodePort: 30803
  type: NodePort
