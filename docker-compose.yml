networks:
  microservice-net:
    driver: bridge
 
volumes:
  user-db-data:
  product-db-data:
  order-db-data:
  rabbitmq-data:          # ✅ FIX: tambahkan volume RabbitMQ
 
services:
 
  # ═══════════════════════════════════════════
  # RABBITMQ — Message Broker
  # ═══════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: "MICROSERVICE_IAE_COOKIE"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq   # ✅ FIX: mount volume agar cookie persisten
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - microservice-net
 
  # ═══════════════════════════════════════════
  # USER SERVICE DATABASE
  # ═══════════════════════════════════════════
  user-db:
    image: mysql:8
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userservice_db
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - microservice-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s
 
  # ═══════════════════════════════════════════
  # USER SERVICE — Laravel
  # ═══════════════════════════════════════════
  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8001:8000"
    # ✅ FIX: HAPUS entrypoint override — biarkan docker-entrypoint.sh jalan
    # entrypoint: ["php", "artisan", "serve"...]  <-- INI PENYEBAB MIGRASI TIDAK JALAN
    env_file:
      - ./UserService/.env.docker
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - microservice-net
    restart: unless-stopped
 
  # ═══════════════════════════════════════════
  # PRODUCT SERVICE DATABASE
  # ═══════════════════════════════════════════
  product-db:
    image: mysql:8
    container_name: product-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productservice_db
    volumes:
      - product-db-data:/var/lib/mysql
    networks:
      - microservice-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s
 
  # ═══════════════════════════════════════════
  # PRODUCT SERVICE — Laravel (HTTP)
  # ═══════════════════════════════════════════
  product-service:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8002:8000"
    # ✅ FIX: HAPUS entrypoint override
    # entrypoint: ["php", "artisan", "serve"...]  <-- INI PENYEBAB MIGRASI TIDAK JALAN
    env_file:
      - ./ProductService/.env.docker
    depends_on:
      product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-net
    restart: unless-stopped
 
  # ═══════════════════════════════════════════
  # PRODUCT SERVICE WORKER — RabbitMQ Consumer
  # ═══════════════════════════════════════════
  product-worker:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    container_name: product-worker
    env_file:
      - ./ProductService/.env.docker
    depends_on:
      product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-net
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== Product Worker Starting ==="
        php artisan key:generate --no-interaction --force 2>/dev/null || true
        echo "Menunggu database..."
        for i in $(seq 1 30); do
          mysqladmin ping -h product-db -u root -proot --silent 2>/dev/null && break
          echo "Percobaan $i/30..."; sleep 3
        done
        php artisan migrate --force --no-interaction 2>/dev/null || true
        echo "=== Worker mulai consume queue ==="
        php artisan queue:work rabbitmq --queue=product-stock-update --verbose --tries=3 --timeout=90
 
  # ═══════════════════════════════════════════
  # ORDER SERVICE DATABASE
  # ═══════════════════════════════════════════
  order-db:
    image: mysql:8
    container_name: order-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderservice_db
    volumes:
      - order-db-data:/var/lib/mysql
    networks:
      - microservice-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s
 
  # ═══════════════════════════════════════════
  # ORDER SERVICE — Node.js + Express
  # ═══════════════════════════════════════════
  order-service:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DB_HOST: order-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: orderservice_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      USER_SERVICE_URL: http://user-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - microservice-net
    restart: unless-stopped
 
  # ═══════════════════════════════════════════
  # UI — React.js (Nginx)
  # ═══════════════════════════════════════════
  ui:
    build:
      context: ./UserInterface
      dockerfile: Dockerfile
      args:
        REACT_APP_USER_SERVICE_URL: http://localhost:8001
        REACT_APP_PRODUCT_SERVICE_URL: http://localhost:8002
        REACT_APP_ORDER_SERVICE_URL: http://localhost:8003
    container_name: ui
    ports:
      - "3000:80"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservice-net
    restart: unless-stopped